plugins {
  id 'com.android.application'
}

/* The web app in ../habits is the single source of truth. It is copied into the
   APK's assets at build time so the two can never drift apart. A Sync rather
   than a Copy, so a file deleted there leaves the APK too: with a Copy, any
   build without a clean still carried the 230 voice notes 2.9 renamed. */
def webAppDir = file("$rootDir/../habits")
def generatedAssets = layout.buildDirectory.dir("generated/webAssets").get().asFile

tasks.register('copyWebApp', Sync) {
  from(webAppDir) {
    exclude 'README.md'
    exclude 'check.js'      // the pre-ship checks run on a computer, not in the app
    exclude '**/.*'
  }
  into "$generatedAssets/www"
}

android {
  namespace 'com.pablo.glowapp'
  /* Android 16. Targeting it is what current Play Protect expects of an
     installable app; 2.7 targeted 15 and an Android 16 phone refused it. */
  compileSdk 36
  buildToolsVersion '36.1.0'

  defaultConfig {
    applicationId 'com.pablo.glowapp'
    minSdk 24
    targetSdk 36
    versionCode 17
    versionName '2.14'
  }

  /* Voice notes are played natively straight from the APK with openFd(),
     which needs them stored uncompressed. Opus is compressed audio already,
     so nothing is lost. */
  androidResources {
    noCompress += ['webm']
  }

  sourceSets {
    main {
      assets.srcDirs += generatedAssets
    }
  }

  signingConfigs {
    release {
      def props = new Properties()
      def propsFile = file("$rootDir/keystore/keystore.properties")
      if (propsFile.exists()) {
        propsFile.withInputStream { props.load(it) }
        storeFile file("$rootDir/keystore/${props.getProperty('storeFile')}")
        storePassword props.getProperty('storePassword')
        keyAlias props.getProperty('keyAlias')
        keyPassword props.getProperty('keyPassword')
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      signingConfig signingConfigs.release
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_11
    targetCompatibility JavaVersion.VERSION_11
  }
}

/* Hanging the copy off preBuild makes it an implicit dependency of every task
   that later reads the generated assets — including lint, which otherwise warns
   that it consumes the directory without declaring it. */
tasks.named('preBuild') {
  dependsOn 'copyWebApp'
}
